{% extends "base.html" %}
{% block title %}New discussion · The Logging Camp{% endblock %}
{% block content %}<section class="form-card"><a class="back" href="{{ url_for('index') }}">← Back to the board</a><div class="eyebrow muted">START SOMETHING GOOD</div><h1>New discussion.</h1><p>Have an idea or a question? Share it with the camp.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Title</label><input id="title" name="title" required maxlength="120" value="{{ request.form.get('title', '') }}"><label for="category">Category</label><select id="category" name="category">{% for c in categories %}<option {% if request.form.get('category') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><label for="body">Message</label><textarea id="body" name="body" required maxlength="10000" rows="8">{{ request.form.get('body', '') }}</textarea><button class="button dark">Post discussion →</button></form></section>{% endblock %}
